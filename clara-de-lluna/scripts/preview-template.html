<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clara de Lluna Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500&display=swap">
<style>
/* Layout: a printed menu card read by candlelight. One narrow column, centered
   headings, dotted leaders to the price, arch-framed photos like moonlit windows. */
:root{
  --paper:#f4eee3;      /* ivory card stock */
  --card:#fbf8f2;
  --ink:#1a2236;        /* midnight ink */
  --soft:#5f6476;       /* secondary text */
  --brass:#94723a;      /* brass foil, AA on ivory */
  --rule:#d9cfbd;
  --veil:rgb(244 238 227 / .86);
  --shade:26 34 54;
  --display:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --body:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1422; --card:#151c2e; --ink:#efe7d6; --soft:#a7a9b6; --brass:#d2b278;
  --rule:#2b3349; --veil:rgb(14 20 34 / .86); --shade:0 0 0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1422; --card:#151c2e; --ink:#efe7d6; --soft:#a7a9b6; --brass:#d2b278;
  --rule:#2b3349; --veil:rgb(14 20 34 / .86); --shade:0 0 0; color-scheme:dark;
}
[dir="rtl"]{--display:'Amiri','Times New Roman',serif; --body:'Tajawal',system-ui,sans-serif}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:400;
  font-size:15px;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(90% 50% at 50% 0%, color-mix(in srgb,var(--brass) 9%,transparent), transparent 70%)}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%;display:block}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}
.hide-sb{scrollbar-width:none}.hide-sb::-webkit-scrollbar{display:none}
.wrap{max-width:540px;margin:0 auto;padding-inline:20px}
.sc{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}
[dir="rtl"] .sc{letter-spacing:0;font-size:13px}
:focus-visible{outline:1px solid var(--brass);outline-offset:3px}

/* top controls */
.bar{display:flex;justify-content:space-between;align-items:center;padding-block:18px 0}
.ctl{display:flex;gap:6px}
.tbtn{height:34px;min-width:34px;padding:0 12px;border:1px solid var(--rule);border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.tbtn:hover{border-color:var(--brass)}
.tbtn svg{width:15px;height:15px}
.status{display:inline-flex;align-items:center;gap:8px;color:var(--soft)}
.status i{width:6px;height:6px;border-radius:50%;background:#3f9a6e;box-shadow:0 0 0 3px color-mix(in srgb,#3f9a6e 22%,transparent)}
.status.off i{background:#b5563c;box-shadow:0 0 0 3px color-mix(in srgb,#b5563c 22%,transparent)}

/* hero */
.hero{text-align:center;padding-block:34px 8px}
.moon{width:58px;height:58px;margin:0 auto 18px;color:var(--brass)}
.name{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(44px,12vw,58px);line-height:.95;letter-spacing:-.01em}
[dir="rtl"] .name{font-style:normal;font-weight:700;font-size:clamp(38px,10vw,50px);line-height:1.3}
.place{color:var(--brass);margin-top:14px}
.tagline{font-family:var(--display);font-style:italic;font-size:19px;color:var(--soft);margin-top:10px}
[dir="rtl"] .tagline{font-style:normal}
.orn{display:flex;align-items:center;gap:14px;color:var(--brass);margin:26px auto 0;max-width:260px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule))}
.orn::after{background:linear-gradient(270deg,transparent,var(--rule))}
.orn svg{width:14px;height:14px}

/* signatures */
.sig{padding-block:30px 6px}
.eyebrow{display:block;text-align:center;color:var(--brass)}
.sig h2{font-family:var(--display);font-style:italic;font-size:30px;text-align:center;margin-top:4px}
[dir="rtl"] .sig h2{font-style:normal}
.rail{display:flex;gap:16px;overflow-x:auto;padding:20px 20px 6px;margin-inline:-20px;scroll-snap-type:x mandatory;scroll-padding-inline:20px}
.sigc{flex:0 0 138px;scroll-snap-align:start;text-align:center}
.arch{aspect-ratio:3/4;width:100%;border-radius:999px 999px 6px 6px;overflow:hidden;background:var(--card);
  box-shadow:0 14px 30px -18px rgb(var(--shade)/.55);outline:1px solid color-mix(in srgb,var(--brass) 35%,transparent);outline-offset:4px}
.arch img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.sigc:hover img{transform:scale(1.04)}
.sigc .n{font-family:var(--display);font-style:italic;font-size:18px;line-height:1.15;margin-top:14px}
[dir="rtl"] .sigc .n{font-style:normal}
.sigc .p{color:var(--brass);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--veil);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-block:1px solid var(--rule);margin-top:26px}
.nav-in{display:flex;gap:22px;overflow-x:auto;padding:0 20px;max-width:540px;margin:0 auto}
.tab{flex:0 0 auto;padding-block:15px 13px;color:var(--soft);border-bottom:1px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--brass)}

/* search + filters */
.find{padding-block:22px 0}
.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);padding-block:6px}
.search:focus-within{border-color:var(--brass)}
.search svg{width:16px;height:16px;color:var(--soft);flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:6px 0;outline:none}
.search input::placeholder{color:var(--soft);font-style:italic}
.filters{display:flex;gap:8px;overflow-x:auto;padding-block:14px 0}
.chip{flex:0 0 auto;padding:6px 13px;border:1px solid var(--rule);border-radius:999px;font-size:12.5px;color:var(--soft);white-space:nowrap}
.chip.on{border-color:var(--brass);color:var(--ink);background:color-mix(in srgb,var(--brass) 12%,transparent)}

/* sections */
.sect{padding-top:46px;scroll-margin-top:60px}
.sect-h{text-align:center;margin-bottom:22px}
.sect-h h2{font-family:var(--display);font-style:italic;font-size:34px;line-height:1.1}
[dir="rtl"] .sect-h h2{font-style:normal;font-size:30px}
.sect-h .orn{margin-top:10px;max-width:160px}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;padding-block:16px;border-bottom:1px solid color-mix(in srgb,var(--rule) 70%,transparent)}
.item:last-child{border-bottom:0}
.item .th{flex:0 0 58px;height:74px;border-radius:999px 999px 4px 4px;overflow:hidden;background:var(--card)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0}
.line{display:flex;align-items:baseline;gap:8px}
.line h3{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15;text-wrap:pretty;min-width:0}
.lead{flex:1;min-width:10px;border-bottom:1px dotted color-mix(in srgb,var(--soft) 60%,transparent);transform:translateY(-5px)}
.pr{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;font-size:15px}
.pr small{font-size:10.5px;letter-spacing:.12em;color:var(--soft);margin-inline-start:3px;font-weight:400}
.pr .fr{font-size:11px;color:var(--soft);margin-inline-end:4px;font-style:italic}
.ds{color:var(--soft);font-size:13.5px;line-height:1.5;margin:3px 0 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:7px;color:var(--brass);font-size:11px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:11px;height:11px}
.empty{text-align:center;color:var(--soft);font-family:var(--display);font-style:italic;font-size:20px;padding-block:60px}

/* footer */
footer{text-align:center;padding-block:56px 96px;color:var(--soft)}
footer .orn{margin-top:0;margin-bottom:30px}
.info{display:grid;gap:26px;justify-items:center}
.info h4{margin:0 0 8px;color:var(--brass);font-weight:500}
.hours{display:grid;grid-template-columns:auto auto;gap:4px 22px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink)}
.hours span:nth-child(odd){text-align:start;color:var(--soft)}
.hours span:nth-child(even){text-align:end}
.wifi{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.pw{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:999px;padding:5px 6px 5px 14px}
[dir="rtl"] .pw{padding:5px 14px 5px 6px}
.pw code{font-family:var(--body);letter-spacing:.06em;user-select:all}
.pw button{font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--ink);color:var(--paper)}
.addr{color:var(--ink);font-size:14px}
.sign{font-family:var(--display);font-style:italic;font-size:22px;color:var(--ink);margin-top:34px}
.copy{font-size:12px;margin-top:6px}

/* item sheet */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgb(10 14 24 / .55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:500px;max-height:92vh;overflow:hidden auto;background:var(--paper);border-radius:28px 28px 0 0;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);position:relative;
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:28px}}
.ov.show .sheet{transform:none}
.sh-img{position:relative;height:280px;background:var(--card)}
.sh-img img{width:100%;height:100%;object-fit:cover}
.sh-img::after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(to top,var(--paper),transparent)}
.x{position:absolute;top:14px;inset-inline-end:14px;z-index:2;width:38px;height:38px;border-radius:50%;
  background:var(--veil);display:flex;align-items:center;justify-content:center;border:1px solid var(--rule)}
.x svg{width:16px;height:16px}
.sbody{padding:4px 26px 30px;text-align:center}
.sbody .eyebrow{margin-bottom:6px}
.sbody h2{font-family:var(--display);font-style:italic;font-size:36px;line-height:1.05}
[dir="rtl"] .sbody h2{font-style:normal}
.sbody .big{color:var(--brass);font-size:18px;margin-top:10px;font-variant-numeric:tabular-nums}
.sbody .big small{font-size:11px;letter-spacing:.12em;margin-inline-start:3px}
.sbody p.d{color:var(--soft);font-size:15px;line-height:1.65;margin:16px auto 0;max-width:36ch}
.sizes{display:inline-flex;margin-top:22px;border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px}
.sz{padding:8px 16px;border-radius:999px;font-size:13px;color:var(--soft)}
.sz.on{background:var(--ink);color:var(--paper)}
.facts{margin-top:24px;border-top:1px solid var(--rule);padding-top:18px;display:grid;gap:12px;text-align:start}
.facts div{display:flex;justify-content:space-between;gap:16px;font-size:13.5px}
.facts dt{color:var(--brass)}
.facts dd{margin:0;text-align:end;color:var(--ink)}

.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--ink);color:var(--paper);font-size:10.5px;padding:8px 16px;border-radius:999px;white-space:nowrap;
  box-shadow:0 10px 28px -12px rgb(var(--shade)/.6)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="app"></div>
<div class="demo sc" id="demo">Maquette · articles et prix d’exemple</div>

<script>
const MENU = __MENU__;
const IMG = __IMG__;
const T = {
  sig:{en:'Our signatures',fr:'Nos signatures',ar:'أطباقنا المميّزة'},
  sigEye:{en:'Chosen by the house',fr:'Le choix de la maison',ar:'اختيار البيت'},
  search:{en:'Search the menu',fr:'Rechercher une douceur, un café…',ar:'ابحث في القائمة'},
  from:{en:'from',fr:'dès',ar:'من'},
  sizes:{en:'Size',fr:'Format',ar:'الحجم'},
  allergens:{en:'Allergens',fr:'Allergènes',ar:'مسببات الحساسية'},
  diet:{en:'Good to know',fr:'À savoir',ar:'معلومات'},
  none:{en:'Nothing matches your search.',fr:'Rien ne correspond à votre recherche.',ar:'لا توجد نتائج.'},
  open:{en:'Open until',fr:'Ouvert jusqu’à',ar:'مفتوح حتى'},
  closed:{en:'Closed · opens at',fr:'Fermé · ouvre à',ar:'مغلق · يفتح'},
  hours:{en:'Hours',fr:'Horaires',ar:'أوقات العمل'},
  wifi:{en:'Wi-Fi',fr:'Wi-Fi',ar:'واي فاي'},
  copy:{en:'Copy',fr:'Copier',ar:'نسخ'},
  copied:{en:'Copied',fr:'Copié',ar:'تم'},
  find:{en:'Find us',fr:'Nous trouver',ar:'العنوان'},
  signature:{en:'Signature',fr:'Signature',ar:'مميّز'},
  place:{en:'Café · Boumhal',fr:'Café · Boumhal',ar:'مقهى · بومهل'},
  theme:{en:'Switch theme',fr:'Changer le thème',ar:'تبديل السمة'},
  lang:{en:'Language',fr:'Langue',ar:'اللغة'},
  close:{en:'Close',fr:'Fermer',ar:'إغلاق'}
};
const DAYS={en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],fr:['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],ar:['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']};
const TAGL={vegan:{en:'Vegan',fr:'Vegan',ar:'نباتي صرف'},vegetarian:{en:'Vegetarian',fr:'Végétarien',ar:'نباتي'},
  'gluten-free':{en:'Gluten-free',fr:'Sans gluten',ar:'خالٍ من الغلوتين'},spicy:{en:'Spicy',fr:'Relevé',ar:'حار'},
  'contains-nuts':{en:'Nuts',fr:'Fruits à coque',ar:'مكسرات'},decaf:{en:'Decaf',fr:'Décaféiné',ar:'منزوع الكافيين'}};
const ALL={milk:{en:'Milk',fr:'Lait',ar:'حليب'},eggs:{en:'Eggs',fr:'Œufs',ar:'بيض'},gluten:{en:'Gluten',fr:'Gluten',ar:'غلوتين'},
  nuts:{en:'Nuts',fr:'Fruits à coque',ar:'مكسرات'},peanuts:{en:'Peanuts',fr:'Arachides',ar:'فول سوداني'},soy:{en:'Soy',fr:'Soja',ar:'صويا'},sesame:{en:'Sesame',fr:'Sésame',ar:'سمسم'}};
const TAG_ORDER=['vegan','vegetarian','gluten-free','spicy','contains-nuts','decaf'];

const IC={
  Search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  X:'<path d="M18 6 6 18M6 6l12 12"/>',
  Sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  Moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  Leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10zM2 21c0-3 1.85-5.36 5.08-6"/>'
};
function svg(n,a){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" '+(a||'')+'>'+IC[n]+'</svg>';}
const CRESCENT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.2a9 9 0 1 0 5.3 15.6A7.4 7.4 0 0 1 15.5 3.2z" fill="currentColor"/></svg>';
const MOONMARK='<svg class="moon" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M38 14a19 19 0 1 0 12 32.5A15.5 15.5 0 0 1 38 14z" fill="currentColor"/><circle cx="47" cy="20" r="1.3" fill="currentColor"/><circle cx="51.5" cy="28" r=".9" fill="currentColor"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pic(url){const m=(url||'').match(/photo-([0-9a-f-]+)/);const k=m?m[1]:url;return k&&IMG[k]?IMG[k]:null;}

let lang='fr', theme=null, query='', tags=[], sizeIdx=0, current=null;
try{const l=localStorage.getItem('cdl-lang');if(l&&['fr','ar','en'].includes(l))lang=l;}catch(_){}
const $=s=>document.querySelector(s);
const tr=o=>o?(o[lang]||o.en):'';
function money(v){const mm=Math.round(v*1000);return Math.floor(mm/1000)+','+String(mm%1000).padStart(3,'0')+'<small>'+MENU.shop.currency+'</small>';}
const base=it=>it.sizes&&it.sizes.length?Math.min.apply(null,it.sizes.map(s=>s.price)):it.price;
function openState(){
  const h=MENU.shop.hours,now=new Date(),d=now.getDay(),mins=now.getHours()*60+now.getMinutes();
  const toM=s=>{const p=s.split(':');return +p[0]*60+ +p[1]};
  const t=h[d];
  if(t){let o=toM(t.open),c=toM(t.close);const cm=c<=o;if(cm)c+=1440;const cur=(mins<o&&cm)?mins+1440:mins;if(cur>=o&&cur<c)return{open:true,at:t.close};}
  const p=h[(d+6)%7];if(p){const o=toM(p.open),c=toM(p.close);if(c<=o&&mins<c)return{open:true,at:p.close};}
  return{open:false,at:t?t.open:null};
}
function hourRows(){
  const order=[1,2,3,4,5,6,0],h=MENU.shop.hours,rows=[];
  order.forEach(d=>{const v=h[d],k=v?v.open+' – '+v.close:'—';const last=rows[rows.length-1];
    if(last&&last.k===k)last.to=d;else rows.push({from:d,to:d,k});});
  return rows.map(r=>'<span>'+DAYS[lang][r.from]+(r.to!==r.from?' – '+DAYS[lang][r.to]:'')+'</span><span>'+r.k+'</span>').join('');
}
const usedTags=(()=>{const s=new Set();MENU.items.forEach(i=>(i.tags||[]).forEach(t=>s.add(t)));return TAG_ORDER.filter(t=>s.has(t));})();

function applyChrome(){
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;
  if(theme)document.documentElement.setAttribute('data-theme',theme);
}
function isDark(){const a=document.documentElement.getAttribute('data-theme');return a?a==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}

function render(){
  applyChrome();
  const s=MENU.shop,q=query.trim().toLowerCase();
  const match=it=>{if(tags.length&&!tags.every(t=>(it.tags||[]).includes(t)))return false;if(!q)return true;
    return (tr(it.name)+' '+tr(it.description)).toLowerCase().includes(q);};
  const filtering=q.length>0||tags.length>0;
  const cats=MENU.categories.slice().sort((a,b)=>a.order-b.order);
  const featured=MENU.items.filter(i=>i.isFeatured&&i.isAvailable!==false);
  const groups=cats.map(c=>({c,list:MENU.items.filter(i=>i.categoryId===c.id&&match(i))})).filter(g=>g.list.length);
  const os=openState();

  let h='<div class="wrap"><div class="bar">'+
    '<span class="status sc'+(os.open?'':' off')+'"><i></i>'+(os.open?tr(T.open):tr(T.closed))+(os.at?' '+os.at:'')+'</span>'+
    '<div class="ctl"><button class="tbtn sc" id="lang" aria-label="'+tr(T.lang)+'">'+lang.toUpperCase()+'</button>'+
    '<button class="tbtn" id="theme" aria-label="'+tr(T.theme)+'">'+svg(isDark()?'Sun':'Moon')+'</button></div></div>';

  h+='<header class="hero">'+MOONMARK+'<h1 class="name">'+esc(s.name)+'</h1>'+
     '<div class="place sc">'+tr(T.place)+'</div><p class="tagline">'+tr(s.tagline)+'</p>'+
     '<div class="orn">'+CRESCENT+'</div></header>';

  if(!filtering&&featured.length){
    h+='<section class="sig"><span class="eyebrow sc">'+tr(T.sigEye)+'</span><h2>'+tr(T.sig)+'</h2><div class="rail hide-sb">';
    featured.forEach(it=>{const p=pic(it.image);
      h+='<button class="sigc" data-open="'+it.id+'"><div class="arch">'+(p?'<img src="'+p+'" alt="">':'')+'</div>'+
         '<div class="n">'+tr(it.name)+'</div><div class="p">'+(it.sizes&&it.sizes.length?tr(T.from)+' ':'')+money(base(it))+'</div></button>';});
    h+='</div></section>';
  }
  h+='</div>';

  h+='<nav class="nav"><div class="nav-in hide-sb">';
  cats.forEach((c,i)=>{h+='<button class="tab sc'+(i===0?' on':'')+'" data-tab="'+c.id+'">'+tr(c.name)+'</button>';});
  h+='</div></nav>';

  h+='<div class="wrap"><div class="find"><label class="search">'+svg('Search')+
     '<input id="q" type="search" placeholder="'+esc(tr(T.search))+'" value="'+esc(query)+'"></label>';
  if(usedTags.length){h+='<div class="filters hide-sb">';
    usedTags.forEach(t=>{h+='<button class="chip'+(tags.includes(t)?' on':'')+'" data-tag="'+t+'">'+tr(TAGL[t])+'</button>';});
    h+='</div>';}
  h+='</div><main>';
  if(!groups.length)h+='<p class="empty">'+tr(T.none)+'</p>';
  groups.forEach(g=>{
    h+='<section class="sect" id="sec-'+g.c.id+'"><div class="sect-h"><h2>'+tr(g.c.name)+'</h2><div class="orn">'+CRESCENT+'</div></div><div class="items">';
    g.list.forEach(it=>{const p=pic(it.image),hasSz=it.sizes&&it.sizes.length;
      const meta=(it.isFeatured?['<span>'+CRESCENT.replace('<svg','<svg width="11" height="11"')+tr(T.signature)+'</span>']:[])
        .concat((it.tags||[]).filter(t=>t!=='gluten-free'||!(it.tags||[]).includes('vegan')).slice(0,2).map(t=>'<span>'+tr(TAGL[t])+'</span>'));
      h+='<button class="item" data-open="'+it.id+'"'+(it.isAvailable===false?' style="opacity:.5"':'')+'>'+
        (p?'<div class="th"><img src="'+p+'" alt="" loading="lazy"></div>':'')+
        '<div class="tx"><div class="line"><h3>'+tr(it.name)+'</h3><span class="lead"></span><span class="pr">'+(hasSz?'<span class="fr">'+tr(T.from)+'</span>':'')+money(base(it))+'</span></div>'+
        '<p class="ds">'+tr(it.description)+'</p>'+(meta.length?'<div class="meta">'+meta.join('<span aria-hidden="true">·</span>')+'</div>':'')+
        '</div></button>';});
    h+='</div></section>';
  });
  h+='</main>';

  h+='<footer><div class="orn">'+CRESCENT+'</div><div class="info">'+
     '<div><h4 class="sc">'+tr(T.hours)+'</h4><div class="hours">'+hourRows()+'</div></div>'+
     (s.wifi?'<div class="wifi"><h4 class="sc">'+tr(T.wifi)+'</h4><span>'+esc(s.wifi.ssid)+'</span>'+
       '<span class="pw"><code id="pwd">'+esc(s.wifi.password)+'</code><button id="cp">'+tr(T.copy)+'</button></span></div>':'')+
     '<div><h4 class="sc">'+tr(T.find)+'</h4><div class="addr">'+tr(s.address)+'</div></div></div>'+
     '<div class="sign">'+tr(s.tagline)+'</div><div class="copy">© '+new Date().getFullYear()+' '+esc(s.name)+'</div></footer></div>';

  $('#app').innerHTML=h;
  wire();
}

function wire(){
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(b.getAttribute('data-open')));
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById('sec-'+b.getAttribute('data-tab'));
    if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});});
  document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{const t=b.getAttribute('data-tag');tags=tags.includes(t)?tags.filter(x=>x!==t):tags.concat(t);render();});
  const qi=$('#q');if(qi)qi.oninput=e=>{query=e.target.value;const sel=e.target.selectionStart;render();const n=$('#q');if(n){n.focus();try{n.setSelectionRange(sel,sel)}catch(_){}}};
  $('#lang').onclick=()=>{lang=lang==='fr'?'ar':lang==='ar'?'en':'fr';try{localStorage.setItem('cdl-lang',lang)}catch(_){}render();};
  $('#theme').onclick=()=>{theme=isDark()?'light':'dark';render();};
  const cp=$('#cp');if(cp)cp.onclick=()=>{const done=()=>{cp.textContent=tr(T.copied);setTimeout(()=>cp.textContent=tr(T.copy),1600);};
    const sel=()=>{const r=document.createRange();r.selectNodeContents($('#pwd'));const s=getSelection();s.removeAllRanges();s.addRange(r);};
    try{navigator.clipboard.writeText(MENU.shop.wifi.password).then(done,sel);}catch(_){sel();}};
  spy();
}
function spy(){
  let cur=null;document.querySelectorAll('.sect').forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*0.35)cur=s.id.slice(4);});
  const tabs=document.querySelectorAll('.tab');if(!tabs.length)return;
  if(!cur)cur=tabs[0].getAttribute('data-tab');
  tabs.forEach(t=>{const on=t.getAttribute('data-tab')===cur;t.classList.toggle('on',on);
    if(on&&t.dataset.was!=='1'){const bar=t.parentElement;bar.scrollTo({left:t.offsetLeft-bar.clientWidth/2+t.clientWidth/2,behavior:'smooth'});}
    t.dataset.was=on?'1':'';});
}
addEventListener('scroll',spy,{passive:true});

function openItem(id){current=MENU.items.find(i=>i.id===id);sizeIdx=0;if(!current)return;
  renderSheet();$('#ov').classList.add('show');document.body.style.overflow='hidden';setTimeout(()=>{const x=$('#xbtn');if(x)x.focus();},50);}
function closeItem(){$('#ov').classList.remove('show');document.body.style.overflow='';}
function renderSheet(){
  const it=current,p=pic(it.image),hasSz=it.sizes&&it.sizes.length,price=hasSz?it.sizes[sizeIdx].price:it.price;
  let h='<button class="x" id="xbtn" aria-label="'+tr(T.close)+'">'+svg('X')+'</button>';
  if(p)h+='<div class="sh-img"><img src="'+p+'" alt=""></div>';else h+='<div style="height:64px"></div>';
  h+='<div class="sbody">'+(it.isFeatured?'<div class="eyebrow sc">'+tr(T.signature)+'</div>':'')+
     '<h2>'+tr(it.name)+'</h2><div class="big">'+money(price)+'</div><p class="d">'+tr(it.description)+'</p>';
  if(hasSz){h+='<div class="sizes" role="group" aria-label="'+tr(T.sizes)+'">';
    it.sizes.forEach((sz,i)=>{h+='<button class="sz'+(i===sizeIdx?' on':'')+'" data-sz="'+i+'">'+tr(sz.label)+'</button>';});h+='</div>';}
  const facts=[];
  if(it.tags&&it.tags.length)facts.push('<div><dt class="sc">'+tr(T.diet)+'</dt><dd>'+it.tags.map(t=>tr(TAGL[t])).join(' · ')+'</dd></div>');
  if(it.allergens&&it.allergens.length)facts.push('<div><dt class="sc">'+tr(T.allergens)+'</dt><dd>'+it.allergens.map(a=>tr(ALL[a])).join(' · ')+'</dd></div>');
  if(facts.length)h+='<dl class="facts">'+facts.join('')+'</dl>';
  h+='</div>';
  $('#sheet').innerHTML=h;
  $('#xbtn').onclick=closeItem;
  document.querySelectorAll('[data-sz]').forEach(b=>b.onclick=()=>{sizeIdx=+b.getAttribute('data-sz');renderSheet();});
}

const ov=document.createElement('div');ov.className='ov';ov.id='ov';
ov.innerHTML='<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>';
document.body.appendChild(ov);
ov.addEventListener('click',e=>{if(e.target===ov)closeItem();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeItem();});
render();
</script>
